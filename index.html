<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Furnitur 3D + AR</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; background: #f5f5f3; color: #222; }
    main { max-width: 900px; margin: 0 auto; padding: 24px 16px 40px; }
    .card { background: white; border-radius: 18px; padding: 20px; box-shadow: 0 4px 20px #0000000b; }
    h1 { font-size: 26px; margin: 0 0 8px; }
    p { line-height: 1.5; color: #555; }
    model-viewer { width: 100%; height: 430px; background: #f7f7f7; border-radius: 12px; }
    .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    a.button, button { display: inline-block; border: 0; border-radius: 10px; padding: 13px 18px; font-size: 15px; text-decoration: none; cursor: pointer; }
    button { background: #222; color: white; }
    a.button { background: #e9e9e6; color: #222; }
    .hint { font-size: 13px; color: #777; margin-top: 14px; }
    @media (max-width: 600px) { model-viewer { height: 340px; } h1 { font-size: 22px; } }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>Demo Furnitur 3D</h1>
      <p>Putar dan perbesar model untuk melihat bentuk furnitur dari berbagai sisi. Jika perangkat mendukung AR, tekan “Lihat di Ruangan Saya”.</p>

      <model-viewer
        id="furniture"
        src="./model.glb"
        alt="Model 3D furnitur"
        camera-controls
        auto-rotate
        shadow-intensity="1"
        exposure="1"
        ar
        ar-modes="scene-viewer quick-look"
        ar-placement="floor"
        ar-scale="auto"
        loading="eager">
      </model-viewer>

      <div class="buttons">
        <button type="button" id="arButton">Lihat di Ruangan Saya (AR)</button>
        <a class="button" id="buyLink" href="https://shopee.co.id/" target="_blank" rel="noopener">Beli Produk</a>
      </div>
      <p class="hint">Catatan: AR hanya bekerja pada perangkat dan browser yang kompatibel. Jika AR tidak tersedia, model 3D tetap bisa diputar di atas.</p>
    </div>
  </main>
  <script>
    const viewer = document.getElementById('furniture');
    document.getElementById('arButton').addEventListener('click', async () => {
      if (!viewer.loaded) {
        alert('Model masih dimuat. Tunggu sebentar lalu coba lagi.');
        return;
      }
      if (viewer.canActivateAR) {
        try { await viewer.activateAR(); }
        catch (e) { alert('AR tidak dapat dibuka di perangkat ini. Tampilan 3D tetap bisa digunakan.'); }
      } else {
        alert('Perangkat atau browser ini belum mendukung AR. Anda tetap bisa memutar dan memperbesar model 3D.');
      }
    });
  </script>
</body>
</html>
