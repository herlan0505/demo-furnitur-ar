
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produk Furnitur</title>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f3;
      color: #222;
    }

    .wrap {
      width: min(100% - 32px, 1000px);
      margin: 0 auto;
    }

    main {
      padding: 24px 0 40px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 4px 18px #0000000a;
    }

    model-viewer {
      display: block;
      width: 100%;
      height: min(60vh, 500px);
      min-height: 300px;
      background: #f7f7f6;
      border-radius: 12px;
    }

    h2 {
      margin: 18px 0 8px;
      font-size: 23px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    button, a.button {
      border: 0;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      transition: background 0.2s, transform 0.2s;
    }

    button {
      color: #fff;
      background: #222;
    }

    button:hover {
      background: #444;
    }

    a.button {
      color: #fff;
      background: #2457C5;
      box-shadow: 0 4px 0 #173D91;
    }

    a.button:hover {
      background: #1947AA;
      transform: translateY(-1px);
    }

    a.button:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #173D91;
    }

    .hint {
      font-size: 13px;
      color: #777;
      line-height: 1.45;
      margin-top: 13px;
    }

    @media (max-width: 480px) {
      .card { padding: 12px; }

      model-viewer {
        min-height: 260px;
      }

      .buttons {
        flex-direction: column;
      }

      button, a.button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
<main class="wrap">
  <section id="productArea"></section>
</main>

<script>
const products = [
  {
    id: "livingroom-table",
    name: "livingroom table",
    price: "Rp 500.000",
    model: "./models/livingroom-table.glb",
    buyUrl: "https://shopee.co.id/",
    description: "Meja makan dengan model 3D yang dapat diputar dan diperbesar."
  },
  {
    id: "barstool",
    name: "Barstool",
    price: "Rp 200.000",
    model: "./models/barstool.glb",
    buyUrl: "https://shopee.co.id/",
    description: "Lihat bentuk dan material Barstool sebelum membuka toko penjual."
  },
  {
    id: "meja-tv-minimalist",
    name: "Meja TV Minimalist",
    price: "Isi harga produk",
    model: "./models/meja-tv-minimalist.glb",
    buyUrl: "https://s.shopee.co.id/6fiDESmErv",
    description: "Lihat Meja TV Minimalist dari berbagai sisi dan coba AR pada perangkat yang kompatibel."
  }
];

const params = new URLSearchParams(window.location.search);
const requestedId = params.get("product");
const product = products.find(item => item.id === requestedId) || products[0];

const area = document.getElementById("productArea");
const card = document.createElement("article");
card.className = "card";

const viewer = document.createElement("model-viewer");
viewer.setAttribute("src", product.model);
viewer.setAttribute("alt", "Model 3D " + product.name);
viewer.setAttribute("camera-controls", "");
viewer.setAttribute("auto-rotate", "");
viewer.setAttribute("shadow-intensity", "1");
viewer.setAttribute("ar", "");
viewer.setAttribute("ar-modes", "scene-viewer quick-look");
viewer.setAttribute("ar-placement", "floor");
viewer.setAttribute("ar-scale", "auto");
viewer.setAttribute("loading", "eager");

const title = document.createElement("h2");
title.textContent = product.name;

const buttons = document.createElement("div");
buttons.className = "buttons";

const arButton = document.createElement("button");
arButton.type = "button";
arButton.textContent = "Lihat di Ruangan Saya (AR)";

arButton.addEventListener("click", async () => {
  if (!viewer.loaded) {
    alert("Model sedang dimuat. Tunggu sebentar, lalu coba lagi.");
    return;
  }

  if (!viewer.canActivateAR) {
    alert("AR tidak tersedia pada perangkat/browser ini. Anda tetap bisa memutar dan memperbesar model 3D.");
    return;
  }

  try {
    await viewer.activateAR();
  } catch (e) {
    alert("AR tidak dapat dibuka. Tampilan 3D tetap bisa digunakan.");
  }
});

const buy = document.createElement("a");
buy.className = "button";
buy.href = product.buyUrl;
buy.target = "_blank";
buy.rel = "noopener";
buy.textContent = "Beli Produk";

const hint = document.createElement("p");
hint.className = "hint";
hint.textContent = "Jika model tidak muncul, periksa nama dan lokasi file GLB di repository.";

buttons.append(arButton, buy);
card.append(viewer, title, buttons, hint);
area.appendChild(card);
</script>
</body>
</html>
